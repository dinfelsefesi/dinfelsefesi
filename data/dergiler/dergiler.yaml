# Dergiler sayfasının kalıcı bilgileri (dinfelsefesi.com.tr/dergiler/)
#
# İlk sürüm Abdullah Akgül'ün DERGİLER.xlsx listesinden ve 30.10.2026 taramasından üretildi.
# Alanlar:
#   kod            DergiPark adresindeki kısa ad (dergipark.org.tr/tr/pub/KOD)
#   dizin          TR Dizin, DOAJ, ESCI, Scopus. null: bilinmiyor. Gece taraması (scripts/dergi_durum.py)
#                  DergiPark'taki Dizinler sayfasını okur ve bu değerlerin yerine onu kullanır;
#                  dizin_elle: true olan dergilerde buradaki değerler geçerlidir.
#   yayin_modeli   Taramada okunamazsa bu değer gösterilir.
#   kabul_donemi   Elle tutulur. Dergiler bunu serbest metinle yazdığı için tarama değiştirmez.
#   ad_elle        true ise dergi adı DergiPark'tan okunan adla değiştirilmez.
#   onceki_kodlar  Adı değişen derginin eski DergiPark kodları; eski makaleleri bu dergiye sayılır.
#   dergipark_disi DergiPark'tan ayrılmış dergi; gece taraması bu dergiye bakmaz.
# Makale sayıları burada tutulmaz, derlemede data/dergipark/din_felsefesi.jsonl dosyasından hesaplanır.
