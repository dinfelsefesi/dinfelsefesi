name: YÖK DOI'siz makaleleri arama
# YÖK Akademik ve AVESİS listelerinde DOI'si olmayan makaleler adlarıyla OpenAlex'te ve TR Dizin'de aranır;
# bulunanların anahtar kelime ve özetleri kaydedilir. Ayda bir, DOI okumasından sonra çalışır.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 14 3 * *"
permissions:
  contents: write
concurrency:
  group: orcid
  cancel-in-progress: false
jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - run: TASLAK_GOSTER=1 python3 scripts/yok_baslik_ara.py
      - name: Sonucu kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/yok/baslik_arama.json
          git commit -m "YÖK DOI'siz makaleler arandı" || exit 0
          git pull --rebase -q && git push -q
