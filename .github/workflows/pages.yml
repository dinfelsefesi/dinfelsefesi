name: Siteyi derle ve yayımla

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "content/adaylar.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Siteyi derle
        run: python build.py
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://dinfelsefesi.github.io/dinfelsefesi' }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Hostinge FTP ile yükleme. FTP_SUNUCU, FTP_KULLANICI ve FTP_SIFRE gizli
  # bilgileri tanımlanmadıysa bu adım hiçbir şey yapmadan geçer.
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Siteyi hosting adresi için derle
        run: python build.py
        env:
          SITE_URL: ${{ vars.HOSTING_URL || 'https://dinfelsefesi.com.tr/yeni' }}
          NOINDEX: ${{ vars.HOSTING_NOINDEX || '1' }}
      - name: FTP ile yükle
        env:
          FTP_SUNUCU: ${{ secrets.FTP_SUNUCU }}
          FTP_KULLANICI: ${{ secrets.FTP_KULLANICI }}
          FTP_SIFRE: ${{ secrets.FTP_SIFRE }}
        run: |
          if [ -z "$FTP_SUNUCU" ] || [ -z "$FTP_KULLANICI" ] || [ -z "$FTP_SIFRE" ]; then
            echo "FTP bilgileri tanımlı değil, hosting yüklemesi atlandı."; exit 0
          fi
          sudo apt-get install -y -qq lftp >/dev/null
          AYAR="set ftp:ssl-allow true; set net:max-retries 3"
          # Hesap bütün alan adı klasörünü görüyorsa (public_html varsa) site public_html/yeni içine,
          # yalnızca "yeni" klasörünü görüyorsa doğrudan hesabın köküne yüklenir.
          if lftp -u "$FTP_KULLANICI","$FTP_SIFRE" "$FTP_SUNUCU" -e "$AYAR; cls -1 public_html/ >/dev/null; bye"; then
            HEDEF="public_html/yeni"
          else
            HEDEF="."
          fi
          echo "Yükleme klasörü: $HEDEF"
          lftp -u "$FTP_KULLANICI","$FTP_SIFRE" "$FTP_SUNUCU" -e "$AYAR; mkdir -f -p $HEDEF; mirror --reverse --delete --only-newer --verbose=1 site/ $HEDEF; bye"
