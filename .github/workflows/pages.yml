name: Siteyi derle ve yayımla

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "content/adaylar.json"
  workflow_dispatch:
  schedule:
    # Her gece 00.07'de (İstanbul) yeniden derlenir, günün makalesi böylece değişir
    - cron: "7 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml pillow
      - name: Siteyi derle
        run: python build.py
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://dinfelsefesi.github.io/dinfelsefesi' }}
          NOINDEX: ${{ vars.PAGES_NOINDEX || '1' }}
          TASLAK_GOSTER: ${{ vars.PAGES_TASLAK_GOSTER || '1' }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Hostinge FTP ile yükleme (dinfelsefesi.com.tr/yeni). FTP_SUNUCU, FTP_KULLANICI ve FTP_SIFRE gizli
  # bilgileri tanımlanmadıysa bu adım hiçbir şey yapmadan geçer.
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml pillow
      - name: Siteyi hosting adresi için derle
        run: |
          echo "::notice::NOINDEX=$NOINDEX TASLAK_GOSTER=$TASLAK_GOSTER"
          python build.py
        env:
          SITE_URL: ${{ vars.HOSTING_URL || 'https://dinfelsefesi.com.tr' }}
          NOINDEX: '0'  # asıl site arama motorlarına açık (21.10.2026); eski HOSTING_NOINDEX değişkeni artık kullanılmaz
          TASLAK_GOSTER: ${{ vars.HOSTING_TASLAK_GOSTER || '1' }}
      - name: FTP ile yükle
        env:
          FTP_SUNUCU: ${{ secrets.FTP_SUNUCU }}
          FTP_KULLANICI: ${{ secrets.FTP_KULLANICI }}
          FTP_SIFRE: ${{ secrets.FTP_SIFRE }}
          HOSTING_HEDEF: ${{ vars.HOSTING_HEDEF }}
        run: |
          if [ -z "$FTP_SUNUCU" ] || [ -z "$FTP_KULLANICI" ] || [ -z "$FTP_SIFRE" ]; then
            echo "FTP bilgileri tanımlı değil, hosting yüklemesi atlandı."; exit 0
          fi
          sudo apt-get install -y -qq lftp >/dev/null
          # Sertifika sunucunun kendi adına düzenlenmiş olabilir. O adı sertifikadan okuyup,
          # aynı sunucuyu gösteriyorsa bağlantıyı o adla kurarız. Böylece güvenlik kontrolü açık kalır.
          IP=$(getent hosts "$FTP_SUNUCU" | awk '{print $1}' | head -1)
          CN=$(openssl s_client -connect "$FTP_SUNUCU:21" -starttls ftp -servername "$FTP_SUNUCU" </dev/null 2>/dev/null \
               | openssl x509 -noout -subject 2>/dev/null | sed -n 's/.*CN *= *\([^,/]*\).*/\1/p' | tr -d ' ')
          CN_IP=$(getent hosts "$CN" | awk '{print $1}' | head -1)
          echo "::warning::Sertifika adı: ${CN:-okunamadı}; aynı sunucu: $([ -n "$CN" ] && [ "$CN_IP" = "$IP" ] && echo evet || echo hayır)"
          if [ -n "$CN" ] && [ "$CN_IP" = "$IP" ]; then FTP_SUNUCU="$CN"; fi
          AYAR="set ftp:ssl-allow true; set net:max-retries 3"
          # Hesap alan adının klasörünü görüyor (/domains/dinfelsefesi.com.tr). Site yalnızca public_html/yeni
          # içine yüklenir. Silme işlemi de yalnızca bu klasörün içinde yapılır. public_html bulunamazsa
          # hiçbir şey yüklenmez, böylece başka bir klasöre yanlışlıkla dokunulmaz.
          if ! lftp -u "$FTP_KULLANICI","$FTP_SIFRE" "$FTP_SUNUCU" -e "$AYAR; cls -1 public_html/ >/dev/null; bye" > kontrol.log 2>&1; then
            echo "::error::public_html klasörü bulunamadı ya da bağlanılamadı: $(grep -v -i pass kontrol.log | tail -3 | tr '\n' ' ' | cut -c1-400)"; exit 1
          fi
          HEDEF="${HOSTING_HEDEF:-public_html}"
          HARIC=""
          if [ "$HEDEF" = "public_html" ]; then
            # Ana klasöre yükleme: WordPress hâlâ duruyorsa (wp-config.php) hiçbir şey yapılmaz.
            # Önce yedek alınıp WordPress dosyaları elle silinmelidir.
            if lftp -u "$FTP_KULLANICI","$FTP_SIFRE" "$FTP_SUNUCU" -e "$AYAR; cls -1 public_html/wp-config.php; bye" 2>/dev/null | grep -q wp-config; then
              echo "::error::public_html içinde WordPress (wp-config.php) duruyor. Yedek alıp WordPress dosyalarını sildikten sonra tekrar çalıştırın."; exit 1
            fi
            HARIC="--exclude-glob yeni/ --exclude-glob .well-known/ --exclude-glob cgi-bin/"
          fi
          echo "::warning::Yükleme klasörü: $HEDEF"
          # Yalnızca içeriği değişen dosyalar yüklensin: sunucudaki bir önceki yüklemenin özet listesi indirilir,
          # içeriği aynı kalan dosyaların tarihi eskiye çekilir, mirror --only-newer onları atlar.
          lftp -u "$FTP_KULLANICI","$FTP_SIFRE" "$FTP_SUNUCU" -e "$AYAR; get $HEDEF/.yayin-ozeti -o eski_ozet.txt; bye" >/dev/null 2>&1 || true
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          eski = {}
          if Path("eski_ozet.txt").exists():
              for l in Path("eski_ozet.txt").read_text(encoding="utf-8").splitlines():
                  h, _, f = l.partition(" ")
                  eski[f] = h
          yeni, ayni = [], 0
          for f in sorted(Path("site").rglob("*")):
              if f.is_file():
                  r = str(f.relative_to("site"))
                  h = hashlib.md5(f.read_bytes()).hexdigest()
                  yeni.append(f"{h} {r}")
                  if eski.get(r) == h:
                      os.utime(f, (946684800, 946684800))
                      ayni += 1
          Path("site/.yayin-ozeti").write_text("\n".join(yeni), encoding="utf-8")
          print(f"::notice::Toplam {len(yeni)} dosya, değişmeyen {ayni}")
          PY
          if ! lftp -u "$FTP_KULLANICI","$FTP_SIFRE" "$FTP_SUNUCU" -e "$AYAR; mkdir -f -p $HEDEF; mirror --reverse --delete --only-newer --parallel=4 --verbose=1 $HARIC site/ $HEDEF; bye" > ftp.log 2>&1; then
            echo "::error::FTP hatası: $(grep -v -i pass ftp.log | tail -5 | tr '\n' ' ' | cut -c1-600)"; exit 1
          fi
          echo "::notice::Yüklenen dosya sayısı: $(grep -c -i 'transferring\|Yeni dosya\|file' ftp.log || true)"
