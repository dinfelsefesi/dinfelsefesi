name: IndexNow bildirimi
# Sitedeki bütün sayfaları (site haritası) Bing ve Yandex'e IndexNow ile bildirir. Elle çalıştırılır.
on:
  workflow_dispatch:
jobs:
  bildir:
    runs-on: ubuntu-latest
    steps:
      - name: Site haritasındaki adresleri bildir
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          KEY = "0b0b3770c369e042989bc277c26645c1"
          kok = "https://dinfelsefesi.com.tr/"
          harita = urllib.request.urlopen(kok + "sitemap.xml", timeout=30).read().decode()
          urls = re.findall(r"<loc>(.*?)</loc>", harita)
          govde = json.dumps({"host": "dinfelsefesi.com.tr", "key": KEY, "keyLocation": kok + KEY + ".txt", "urlList": urls}).encode()
          for uc in ["https://api.indexnow.org/indexnow", "https://www.bing.com/indexnow", "https://yandex.com/indexnow"]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(uc, data=govde, headers={"Content-Type": "application/json; charset=utf-8"}), timeout=30)
                  print(f"::notice::{uc}: {len(urls)} adres, HTTP {r.status}")
              except urllib.error.HTTPError as ex:
                  print(f"::warning::{uc}: HTTP {ex.code} {ex.read().decode(errors='replace')[:300]}")
              except Exception as ex:
                  print(f"::warning::{uc}: {ex}")
          PY
