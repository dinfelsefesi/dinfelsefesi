name: OAI hasadı (dergi tarama)
# Elle çalıştırılır: OJS dergisinin OAI-PMH kayıtlarını (oai_dc) toplayıp 'hata-ayiklama' dalına kaydeder.
on:
  workflow_dispatch:
    inputs:
      adres:
        description: "OAI uç noktası (örn. https://site/index.php/kisa/oai)"
        required: true
permissions:
  contents: write
jobs:
  hasat:
    runs-on: ubuntu-latest
    env:
      ADRES: ${{ github.event.inputs.adres }}
    steps:
      - run: |
          mkdir out && cd out && git init -q && git checkout -q -b hata-ayiklama
          python3 - <<'PY' > durum.txt 2>&1 || true
          import os, re, time, urllib.request, urllib.parse
          adres = os.environ["ADRES"]
          url = adres + "?verb=ListRecords&metadataPrefix=oai_dc"
          i = 0
          while url and i < 200:
              req = urllib.request.Request(url, headers={"User-Agent": "dinfelsefesi.com.tr dergi taramasi"})
              try:
                  veri = urllib.request.urlopen(req, timeout=90).read().decode("utf-8", "replace")
              except Exception as e:
                  print("HATA", url, e); break
              i += 1
              open(f"oai_{i:03d}.xml", "w").write(veri)
              m = re.search(r"<resumptionToken[^>]*>([^<]+)</resumptionToken>", veri)
              print(i, len(veri), bool(m))
              url = adres + "?verb=ListRecords&resumptionToken=" + urllib.parse.quote(m.group(1)) if m else None
              time.sleep(1)
          PY
          cat durum.txt
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "oai hasadı"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hata-ayiklama
