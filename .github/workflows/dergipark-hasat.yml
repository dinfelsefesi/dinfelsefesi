name: DergiPark hasadı

# Geçmiş tarama bitene kadar üç saatte bir çalışır, her seferinde
# kaldığı yerden devam eder. Tarama bitince aylık takvime geçirilecek.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      dakika:
        description: "En fazla çalışma süresi (dakika)"
        default: "300"
      ay:
        description: "Yalnızca bu ayı tara (YYYY-AA), boş bırakılırsa geçmiş tarama"
        default: ""

permissions:
  contents: write

concurrency:
  group: dergipark-hasat
  cancel-in-progress: false

jobs:
  hasat:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kayıtları çek
        run: |
          if [ -n "${{ github.event.inputs.ay }}" ]; then
            python3 scripts/dergipark_hasat.py --ay "${{ github.event.inputs.ay }}" --dakika "${{ github.event.inputs.dakika || '300' }}"
          else
            python3 scripts/dergipark_hasat.py --dakika "${{ github.event.inputs.dakika || '300' }}"
          fi
      - name: Sonuçları kaydet
        if: always()
        run: |
          git config user.name "dergipark-hasat"
          git config user.email "dinfelsefesi@gmail.com"
          git add data/dergipark
          git diff --cached --quiet && exit 0
          git commit -m "DergiPark hasadı ($(date -u +%Y-%m-%d %H:%M))"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
