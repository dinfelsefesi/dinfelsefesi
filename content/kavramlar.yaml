# Kavram tarihi sayfasının kavram listesi.
# Her kavram, eserlerin ve tezlerin başlıklarında ve (varsa) anahtar kelimelerinde aranan kalıplarla tanımlanır.
# Kalıplar küçük harfle yazılır; düzeltme işaretleri (â, î, û) ve kesme işaretleri yok sayılır, tire boşluk sayılır.
# Kalıp kelime başından eşleşir: "kötülük" kalıbı "kötülüğün" kelimesini yakalamaz, bu yüzden ek alan biçimler ayrıca yazılır.
# Kalıbın sonuna "$" konursa yalnızca tam kelime aranır ("dua$" kalıbı "dualizm" kelimesini yakalamaz).
# Bir çalışma bir kavrama, kalıplardan kaç tanesi tutarsa tutsun ve başlıkta mı anahtar kelimede mi geçerse geçsin, en çok bir kez sayılır.
# "ara" alanı, Eserler ve Tezler sayfalarına verilecek arama kelimesidir.

